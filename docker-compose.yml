version: "3.9"

# ============================================================
# docker-compose.yml — mini-java-app (application only)
# External services (MySQL, Redis, RabbitMQ) are provided
# separately and referenced via environment variables.
# ============================================================

services:
  mini-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-java-app:latest
    container_name: mini-java-app
    ports:
      - "8080:8080"
    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"

      # JVM
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

      # Database (override with real values at runtime)
      DB_HOST: "${DB_HOST:-localhost}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-mini_app_db}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"

      # Redis cache
      REDIS_HOST: "${REDIS_HOST:-localhost}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      # External API
      EXTERNAL_API_BASE_URL: "${EXTERNAL_API_BASE_URL:-http://api.example.com:8080/v1}"
      EXTERNAL_API_KEY: "${EXTERNAL_API_KEY:-}"
      EXTERNAL_API_TIMEOUT: "${EXTERNAL_API_TIMEOUT:-30000}"

      # Payment service
      PAYMENT_SERVICE_URL: "${PAYMENT_SERVICE_URL:-https://payment.internal.company.com/process}"
      PAYMENT_SERVICE_USERNAME: "${PAYMENT_SERVICE_USERNAME:-}"
      PAYMENT_SERVICE_PASSWORD: "${PAYMENT_SERVICE_PASSWORD:-}"

      # Security
      SECURITY_JWT_SECRET: "${SECURITY_JWT_SECRET:-}"
      SECURITY_ADMIN_USERNAME: "${SECURITY_ADMIN_USERNAME:-admin}"
      SECURITY_ADMIN_PASSWORD: "${SECURITY_ADMIN_PASSWORD:-}"
      SECURITY_ENCRYPTION_KEY: "${SECURITY_ENCRYPTION_KEY:-}"

      # Monitoring
      MONITORING_ENDPOINT: "${MONITORING_ENDPOINT:-http://monitoring.internal.company.com:9090/metrics}"
      MONITORING_USERNAME: "${MONITORING_USERNAME:-}"
      MONITORING_PASSWORD: "${MONITORING_PASSWORD:-}"

      # Messaging (RabbitMQ)
      MESSAGING_RABBITMQ_HOST: "${MESSAGING_RABBITMQ_HOST:-rabbitmq.internal.company.com}"
      MESSAGING_RABBITMQ_PORT: "${MESSAGING_RABBITMQ_PORT:-5672}"
      MESSAGING_RABBITMQ_USERNAME: "${MESSAGING_RABBITMQ_USERNAME:-}"
      MESSAGING_RABBITMQ_PASSWORD: "${MESSAGING_RABBITMQ_PASSWORD:-}"

      # Logging / file paths
      APP_LOG_DIR: "/app/logs"
      APP_LOG_FILE_PATH: "/app/logs/mini-app.log"

      # General
      TZ: UTC

    volumes:
      - app-logs:/app/logs

    networks:
      - app-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app-logs:
    driver: local

networks:
  app-network:
    driver: bridge
