version: '3.8'

services:
  mini-java-app:
    image: mini-java-app:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - APP_PORT=8080
      - HEALTH_PORT=8081
      - CONFIG_PATH=/app/config/app.properties
      - LOG_PATH=/app/logs/mini-app.log
      - LOG_DIR=/app/logs
      - DB_HOST=${DB_HOST:?set DB_HOST}
      - DB_PORT=${DB_PORT:?set DB_PORT}
      - DB_NAME=${DB_NAME:?set DB_NAME}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:?set REDIS_PORT}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:?set EXTERNAL_API_URL}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:?set PAYMENT_SERVICE_URL}
    volumes:
      - app-config:/app/config
      - app-logs:/app/logs
      - app-temp:/tmp/mini-app
      - app-uploads:/app/uploads

volumes:
  app-config:
  app-logs:
  app-temp:
  app-uploads:
