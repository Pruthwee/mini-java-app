version: "3.9"

services:
  mini-java-app:
    image: mini-java-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-java-app
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker

      # Server configuration
      APP_SERVER_PORT: "8080"
      APP_CONTEXT_PATH: /mini-app
      MANAGEMENT_PORT: "8081"

      # Logging
      APP_LOG_LEVEL: INFO

      # Database (provide actual values or override via .env file)
      DB_HOST: "${DB_HOST:-localhost}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-mini_app_db}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"

      # Redis cache
      REDIS_HOST: "${REDIS_HOST:-redis.local}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DATABASE: "${REDIS_DATABASE:-0}"

      # External API
      EXTERNAL_API_BASE_URL: "${EXTERNAL_API_BASE_URL:-http://api.example.com:8080/v1}"
      EXTERNAL_API_TIMEOUT: "${EXTERNAL_API_TIMEOUT:-30000}"
      EXTERNAL_API_KEY: "${EXTERNAL_API_KEY:-}"

      # Payment service
      PAYMENT_SERVICE_URL: "${PAYMENT_SERVICE_URL:-https://payment.internal.company.com/process}"
      PAYMENT_SERVICE_USERNAME: "${PAYMENT_SERVICE_USERNAME:-}"
      PAYMENT_SERVICE_PASSWORD: "${PAYMENT_SERVICE_PASSWORD:-}"

      # Security
      JWT_SECRET: "${JWT_SECRET:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"

      # Messaging (RabbitMQ)
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq.internal.company.com}"
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:-}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-}"

      # Monitoring
      MONITORING_ENDPOINT: "${MONITORING_ENDPOINT:-http://monitoring.internal.company.com:9090/metrics}"
      MONITORING_USERNAME: "${MONITORING_USERNAME:-}"
      MONITORING_PASSWORD: "${MONITORING_PASSWORD:-}"

      # File paths
      APP_CONFIG_DIR: /mnt/config
      APP_LOG_DIR: /mnt/logs
      APP_TEMP_DIR: /tmp/mini-app
      APP_UPLOAD_DIR: /mnt/uploads

      # Environment
      APP_ENVIRONMENT: docker
      DEBUG_ENABLED: "false"

      # JVM options
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Xms256m
        -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC

    volumes:
      - app-config:/mnt/config
      - app-logs:/mnt/logs
      - app-uploads:/mnt/uploads

    networks:
      - app-network

    restart: unless-stopped

volumes:
  app-config:
  app-logs:
  app-uploads:

networks:
  app-network:
    driver: bridge
