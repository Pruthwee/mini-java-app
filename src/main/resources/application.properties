# Mini Java App Configuration

# Server configuration
server.port=${APP_PORT:8080}
server.host=${APP_HOST:localhost}
server.context-path=/mini-app

# Database configuration
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:}
database.password=${DB_PASSWORD:}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# Cache configuration
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=0

# External service URLs
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
external.api.key=${EXTERNAL_API_KEY:}

# Payment service
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# File paths
app.config.directory=${CONFIG_PATH:/app/config}
app.log.directory=${LOG_PATH:/app/logs}
app.temp.directory=${TEMP_PATH:/tmp/mini-app}
app.upload.directory=${UPLOAD_PATH:/app/uploads}

# Security configuration
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment-specific values
environment=${APP_ENVIRONMENT:production}
debug.enabled=false
logging.level=INFO
