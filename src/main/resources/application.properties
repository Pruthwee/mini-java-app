# Mini Java App Configuration - Cloud-Native (AWS Secrets Manager + SSM Parameter Store)
#
# cr-java-0070 fix: Application configuration has been externalized from this
# classpath-bundled properties file to AWS Systems Manager Parameter Store.
# At runtime, MiniApp.loadConfigurationFromParameterStore() retrieves all
# parameters under the SSM_PARAMETER_PATH prefix (default: /mini-app/config)
# using the GetParametersByPath API, enabling:
#   - Runtime configuration changes without redeployment
#   - Environment-specific parameter sets (dev/staging/prod) via path prefixes
#   - Centralized configuration management across all services
#   - Fine-grained IAM access control per parameter
#   - Full audit logging of parameter access via AWS CloudTrail
#   - SecureString parameters for sensitive non-secret configuration values
#
# SSM Parameter Path: controlled by SSM_PARAMETER_PATH environment variable
#   Default: /mini-app/config
#   Example parameters in SSM:
#     /mini-app/config/server.port           -> 8080
#     /mini-app/config/database.url          -> jdbc:mysql://...
#     /mini-app/config/external.api.base-url -> https://api.example.com/v1
#     /mini-app/config/logging.level         -> INFO
#
# cr-java-0113 fix: All hardcoded credentials, API keys, and encryption keys
# have been removed from this file. Sensitive values are now managed exclusively
# through AWS Secrets Manager, enabling centralized secret management, automatic
# rotation, and audit logging via AWS CloudTrail.
#
# Secret names are resolved from environment variables at runtime:
#   DB_SECRET_NAME          -> AWS Secrets Manager secret for DB credentials
#                              (default: "mini-app/db-credentials")
#                              Secret JSON: {"username":"...","password":"..."}
#
#   REDIS_SECRET_NAME       -> AWS Secrets Manager secret for Redis credentials
#                              (default: "mini-app/redis-credentials")
#                              Secret JSON: {"password":"..."}
#
#   API_SECRET_NAME         -> AWS Secrets Manager secret for external API key
#                              (default: "mini-app/api-credentials")
#                              Secret JSON: {"api_key":"..."}
#
#   PAYMENT_SECRET_NAME     -> AWS Secrets Manager secret for payment service
#                              (default: "mini-app/payment-credentials")
#                              Secret JSON: {"username":"...","password":"..."}
#
#   SECURITY_SECRET_NAME    -> AWS Secrets Manager secret for JWT/admin/encryption
#                              (default: "mini-app/security-credentials")
#                              Secret JSON: {"jwt_secret":"...","admin_username":"...",
#                                           "admin_password":"...","encryption_key":"..."}
#
#   MONITORING_SECRET_NAME  -> AWS Secrets Manager secret for monitoring credentials
#                              (default: "mini-app/monitoring-credentials")
#                              Secret JSON: {"username":"...","password":"..."}
#
#   MESSAGING_SECRET_NAME   -> AWS Secrets Manager secret for RabbitMQ credentials
#                              (default: "mini-app/messaging-credentials")
#                              Secret JSON: {"username":"...","password":"..."}

# Server configuration — non-sensitive values remain here
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# cr-java-0070 fix: SSM Parameter Store path prefix for externalized configuration.
# All application configuration parameters are stored in SSM under this path.
# Set SSM_PARAMETER_PATH to /mini-app/dev, /mini-app/staging, or /mini-app/prod
# to select environment-specific parameter sets without code changes.
ssm.parameter.path=${SSM_PARAMETER_PATH:/mini-app/config}

# Database configuration — host/name are non-sensitive; credentials via Secrets Manager
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
# database.username and database.password are NOT stored here.
# They are retrieved at runtime from AWS Secrets Manager (see DB_SECRET_NAME env var).
database.secret.name=${DB_SECRET_NAME:mini-app/db-credentials}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000


# cr-java-0073 fix: HikariCP connection pool settings for Amazon RDS Proxy.
# These values are resolved from environment variables, enabling per-environment
# tuning without code changes (12-factor app principle III).
# Set DB_HOST to the RDS Proxy endpoint (e.g., my-proxy.proxy-xxxx.us-east-1.rds.amazonaws.com).
database.hikari.pool-name=MiniApp-RDSProxy-Pool
database.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
database.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
database.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
database.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
database.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
database.hikari.connection-test-query=SELECT 1
database.hikari.ssl-mode=REQUIRED

# External service configuration — URLs are non-sensitive; API key via Secrets Manager
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
# external.api.key is NOT stored here.
# It is retrieved at runtime from AWS Secrets Manager (see API_SECRET_NAME env var).
external.api.secret.name=${API_SECRET_NAME:mini-app/api-credentials}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# payment.service.username and payment.service.password are NOT stored here.
# They are retrieved at runtime from AWS Secrets Manager (see PAYMENT_SECRET_NAME env var).
payment.service.secret.name=${PAYMENT_SECRET_NAME:mini-app/payment-credentials}

# File/storage configuration — replaced with S3 references (cr-java-0063)
app.s3.bucket=${APP_S3_BUCKET:my-app-bucket}
app.config.s3.key=${APP_CONFIG_S3_KEY:config/app.properties}
app.log.s3.key=${APP_LOG_S3_KEY:logs/mini-app.log}
app.temp.s3.key=${APP_TEMP_S3_KEY:temp/mini-app}
app.upload.s3.key=${APP_UPLOAD_S3_KEY:uploads}

# Security configuration — all secrets via Secrets Manager
# security.jwt.secret, security.admin.username, security.admin.password,
# and security.encryption.key are NOT stored here.
# They are retrieved at runtime from AWS Secrets Manager (see SECURITY_SECRET_NAME env var).
security.secret.name=${SECURITY_SECRET_NAME:mini-app/security-credentials}

# Monitoring configuration — endpoint is non-sensitive; credentials via Secrets Manager
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
# monitoring.username and monitoring.password are NOT stored here.
# They are retrieved at runtime from AWS Secrets Manager (see MONITORING_SECRET_NAME env var).
monitoring.secret.name=${MONITORING_SECRET_NAME:mini-app/monitoring-credentials}

# Messaging configuration — host/port are non-sensitive; credentials via Secrets Manager
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# messaging.rabbitmq.username and messaging.rabbitmq.password are NOT stored here.
# They are retrieved at runtime from AWS Secrets Manager (see MESSAGING_SECRET_NAME env var).
messaging.rabbitmq.secret.name=${MESSAGING_SECRET_NAME:mini-app/messaging-credentials}

# Application environment settings
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
