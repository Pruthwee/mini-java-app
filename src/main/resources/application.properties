# Mini Java App Configuration - Cloud-Ready (AWS)

# Server configuration - externalized via environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# Database configuration - credentials from AWS Secrets Manager
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000
# DB credentials are retrieved from AWS Secrets Manager at runtime via DB_SECRET_NAME
# DB_SECRET_NAME environment variable holds the Secrets Manager secret ARN/name

# Cache configuration - externalized via environment variables
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=0

# External service URLs - externalized via environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
# API key retrieved from AWS Secrets Manager at runtime via EXTERNAL_API_SECRET_NAME

# Payment service - externalized via environment variables
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# Payment credentials retrieved from AWS Secrets Manager at runtime

# File paths - externalized to S3 (cr-java-0061, cr-java-0063, cr-java-0070)
# S3 bucket and key configured via environment variables
app.config.s3.bucket=${APP_S3_BUCKET:}
app.config.s3.key=${APP_CONFIG_S3_KEY:prod/application.properties}
app.log.directory=${APP_LOG_DIR:/tmp/mini-app}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIR:/tmp/mini-app/uploads}

# Security configuration - secrets from AWS Secrets Manager
# JWT secret retrieved from AWS Secrets Manager via SECURITY_SECRET_NAME
# Admin credentials retrieved from AWS Secrets Manager via SECURITY_SECRET_NAME
# Encryption key retrieved from AWS Secrets Manager via SECURITY_SECRET_NAME

# Monitoring/metrics endpoints - externalized via environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
# Monitoring credentials retrieved from AWS Secrets Manager

# Messaging configuration - externalized via environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# RabbitMQ credentials retrieved from AWS Secrets Manager via MESSAGING_SECRET_NAME

# Environment-specific configuration
environment=${ENVIRONMENT:production}
debug.enabled=false

# Safe logging configuration - prevent SDK wire logs from leaking secrets
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
