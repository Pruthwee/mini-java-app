# Mini Java App Configuration - Containerization Ready

# Server configuration - externalized via environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# Database configuration - externalized via environment variables
database.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:password123}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration - externalized via environment variables
cache.redis.host=${REDIS_HOST:redis-service}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs - externalized via environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# S3 configuration for file storage - externalized via environment variables
app.config.s3.bucket=${CONFIG_S3_BUCKET:app-config-bucket}
app.config.s3.key=${CONFIG_S3_KEY:config/app.properties}
app.log.s3.bucket=${LOG_S3_BUCKET:app-logs-bucket}
app.log.s3.key=${LOG_S3_KEY:logs/mini-app.log}
app.upload.s3.bucket=${UPLOAD_S3_BUCKET:app-uploads-bucket}

# Security configuration - externalized via environment variables
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints - externalized via environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring-service:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration - externalized via environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-service}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment configuration - externalized via environment variables
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Spring Boot Actuator - Health Check Endpoint Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
