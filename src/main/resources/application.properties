# Mini Java App Configuration - LOCAL DEVELOPMENT FALLBACK ONLY
#
# cr-java-0070 fix: This classpath-bundled properties file is NO LONGER the
# primary configuration source for this application.
#
# PRIMARY CONFIGURATION SOURCE: AWS Systems Manager (SSM) Parameter Store
# =========================================================================
# All application configuration is now externalized to AWS SSM Parameter Store
# under the path prefix defined by the SSM_PARAMETER_PATH environment variable
# (default: /mini-app).
#
# At runtime, MiniApp.loadConfiguration() fetches all parameters under the
# SSM path prefix via GetParametersByPath and uses them as the active
# application configuration. This enables:
#   - Runtime configuration changes without redeployment
#   - Environment-specific configuration (dev / staging / prod)
#   - Centralized configuration management via AWS Console / CLI / SDK
#   - Audit logging of configuration access via AWS CloudTrail
#   - Fine-grained IAM access control to configuration parameters
#
# To configure the application for a specific environment, store parameters
# in AWS SSM Parameter Store using the AWS CLI, e.g.:
#   aws ssm put-parameter --name "/mini-app/server.host" --value "0.0.0.0" --type String
#   aws ssm put-parameter --name "/mini-app/logging.level" --value "INFO" --type String
#   aws ssm put-parameter --name "/mini-app/environment" --value "production" --type String
#
# FALLBACK BEHAVIOR
# =================
# This file is retained ONLY as a last-resort fallback for local development
# environments where AWS credentials are not available. In all cloud
# deployments (ECS, EKS, Elastic Beanstalk, EC2), the SSM Parameter Store
# is the authoritative configuration source and this file is ignored.
#
# Set the following environment variables in your deployment environment:
#   SSM_PARAMETER_PATH  - SSM path prefix (default: /mini-app)
#   AWS_REGION          - AWS region for SSM client (default: us-east-1)

# cr-java-0077 fix: server.port is no longer hard-coded.
# At runtime the value is resolved from AWS Parameter Store (/mini-app/server-port),
# then from the SERVER_PORT environment variable, and finally defaults to 8080.
# Set the SERVER_PORT environment variable (or the SSM parameter) in your ECS task
# definition / EKS pod spec / Elastic Beanstalk environment to override.
server.port=${SERVER_PORT:8080}
server.host=localhost
server.context-path=/mini-app

# cr-java-0077 fix: database port is no longer hard-coded.
# At runtime the value is resolved from AWS Parameter Store (/mini-app/db-port),
# then from the DB_PORT environment variable, and finally defaults to 3306.
# Set the DB_PORT environment variable (or the SSM parameter) in your deployment
# environment to override.
database.url=jdbc:mysql://localhost:${DB_PORT:3306}/mini_app_db
# cr-java-0073 fix: RDS Proxy endpoint for HikariCP pool connections.
# Set RDS_PROXY_ENDPOINT to the Amazon RDS Proxy endpoint in your deployment
# environment so that HikariCP connects through RDS Proxy for connection
# multiplexing, IAM authentication, and automatic failover.
database.rds-proxy-endpoint=${RDS_PROXY_ENDPOINT:localhost}

# cr-java-0073 fix: HikariCP connection pool settings.
# These replace the previous direct JDBC DriverManager.getConnection() usage.
# Pool sizes are configurable via environment variables per deployment tier.
database.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
database.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
database.hikari.connection-timeout=30000
database.hikari.idle-timeout=600000
database.hikari.max-lifetime=1800000
database.hikari.pool-name=MiniAppHikariPool

# cr-java-0113 fix: database credentials are no longer hard-coded.
# username and password are retrieved at runtime from AWS Secrets Manager
# using the secret name specified by DB_SECRET_NAME environment variable
# (default: mini-app/db-credentials). The secret must contain JSON keys:
# "username", "password", "host", "port", "dbname".
# Reference the secret ARN or name via environment variable - do NOT store
# credentials directly in this file.
database.secret-name=${DB_SECRET_NAME:mini-app/db-credentials}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# cr-java-0077 fix: Redis port is no longer hard-coded.
# At runtime the value is resolved from AWS Parameter Store (/mini-app/redis-port),
# then from the REDIS_PORT environment variable, and finally defaults to 6379.
# Set the REDIS_PORT environment variable (or the SSM parameter) in your deployment
# environment to override.
cache.redis.host=127.0.0.1
cache.redis.port=${REDIS_PORT:6379}

# cr-java-0113 fix: Redis password is no longer hard-coded.
# Retrieve from AWS Secrets Manager using the secret name in REDIS_SECRET_NAME
# environment variable (default: mini-app/redis-credentials).
cache.redis.secret-name=${REDIS_SECRET_NAME:mini-app/redis-credentials}
cache.redis.database=0

# cr-java-0113 fix: External API key is no longer hard-coded.
# Retrieve from AWS Secrets Manager using the secret name in
# EXTERNAL_API_SECRET_NAME environment variable (default: mini-app/external-api-credentials).
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
external.api.secret-name=${EXTERNAL_API_SECRET_NAME:mini-app/external-api-credentials}

# cr-java-0113 fix: Payment service credentials are no longer hard-coded.
# Retrieve from AWS Secrets Manager using the secret name in
# PAYMENT_SECRET_NAME environment variable (default: mini-app/payment-credentials).
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.secret-name=${PAYMENT_SECRET_NAME:mini-app/payment-credentials}

# cr-java-0113 fix: File paths replaced with environment variable references.
# Use environment variables to configure paths per deployment environment.
app.config.directory=${APP_CONFIG_DIR:/opt/app/config}
app.log.directory=${APP_LOG_DIR:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIR:/opt/uploads}

# cr-java-0113 fix: Security secrets are no longer hard-coded.
# JWT secret, admin credentials, and encryption key are retrieved at runtime
# from AWS Secrets Manager using the secret names specified by environment variables.
# Secret name for JWT and security config (default: mini-app/security-credentials).
security.secret-name=${SECURITY_SECRET_NAME:mini-app/security-credentials}

# cr-java-0113 fix: Monitoring credentials are no longer hard-coded.
# Retrieve from AWS Secrets Manager using the secret name in
# MONITORING_SECRET_NAME environment variable (default: mini-app/monitoring-credentials).
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.secret-name=${MONITORING_SECRET_NAME:mini-app/monitoring-credentials}

# cr-java-0113 fix: RabbitMQ credentials are no longer hard-coded.
# Retrieve from AWS Secrets Manager using the secret name in
# MESSAGING_SECRET_NAME environment variable (default: mini-app/messaging-credentials).
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.secret-name=${MESSAGING_SECRET_NAME:mini-app/messaging-credentials}

# Environment configuration
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
