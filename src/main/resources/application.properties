# Mini Java App Configuration — Cloud-Native (AWS)
# All sensitive values and environment-specific settings are externalized.
# Hard-coded credentials, ports, and file paths have been removed.
#
# Fixes applied:
#   blocker-20 (cr-java-0070): Classpath properties replaced with AWS SSM
#               Parameter Store references and environment variable placeholders.
#   blocker-14, blocker-15 (cr-java-0077): Hard-coded port replaced with
#               ${SERVER_PORT} environment variable.
#   blocker-8 to blocker-10, blocker-16 (cr-java-0069, cr-java-0113):
#               DB credentials removed; resolved at runtime from AWS Secrets
#               Manager (secret name controlled by DB_SECRET_NAME env var).
#   blocker-1 to blocker-7 (cr-java-0061, cr-java-0063): File paths removed;
#               S3 bucket/key controlled by APP_S3_BUCKET / CONFIG_S3_KEY /
#               LOG_S3_KEY environment variables.

# ---------------------------------------------------------------------------
# Server configuration — port injected via environment variable (blocker-14,15)
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# AWS region — injected at deploy time
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Database — credentials fetched from AWS Secrets Manager at runtime
# Secret name is supplied via DB_SECRET_NAME environment variable.
# Host and DB name are supplied via DB_HOST / DB_NAME environment variables.
# Port is resolved from SSM Parameter Store (/mini-app/db/port).
# (blocker-8, blocker-9, blocker-10, blocker-11, blocker-12, blocker-16)
# ---------------------------------------------------------------------------
database.secret.name=${DB_SECRET_NAME:mini-app/db-credentials}
database.host=${DB_HOST:localhost}
database.name=${DB_NAME:mini_app_db}
database.port.param=${DB_PORT_PARAM:/mini-app/db/port}
database.pool.max-connections=10
database.pool.connection-timeout=30000
database.pool.idle-timeout=600000
database.pool.max-lifetime=1800000

# ---------------------------------------------------------------------------
# Cache — host/port externalized via environment variables and SSM
# (blocker-13: cr-java-0077)
# ---------------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port.param=${REDIS_PORT_PARAM:/mini-app/redis/port}
cache.redis.database=0
# Redis password must be stored in AWS Secrets Manager — not in this file

# ---------------------------------------------------------------------------
# External service URLs — injected via environment variables (12-factor)
# ---------------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=30000
# API key must be stored in AWS Secrets Manager — not in this file

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# Payment credentials must be stored in AWS Secrets Manager — not in this file

# ---------------------------------------------------------------------------
# S3 storage — replaces hard-coded file paths (blocker-1 to blocker-7)
# ---------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-config-bucket}
app.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log-key=${LOG_S3_KEY:logs/mini-app.log}

# ---------------------------------------------------------------------------
# SSM Parameter Store prefixes (blocker-20: cr-java-0070)
# ---------------------------------------------------------------------------
app.ssm.config-prefix=${APP_CONFIG_PARAM_PREFIX:/mini-app/config}
app.ssm.server-port-param=${SERVER_PORT_PARAM:/mini-app/server/port}

# ---------------------------------------------------------------------------
# Security — all secrets must be stored in AWS Secrets Manager
# JWT secret, admin credentials, and encryption keys are NOT stored here.
# Reference the secret by name via environment variables:
#   SECURITY_SECRET_NAME=mini-app/security-credentials
# ---------------------------------------------------------------------------
security.secret.name=${SECURITY_SECRET_NAME:mini-app/security-credentials}

# ---------------------------------------------------------------------------
# Monitoring — endpoint injected via environment variable
# ---------------------------------------------------------------------------
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
# Monitoring credentials must be stored in AWS Secrets Manager — not in this file

# ---------------------------------------------------------------------------
# Messaging — connection details injected via environment variables
# ---------------------------------------------------------------------------
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# RabbitMQ credentials must be stored in AWS Secrets Manager — not in this file

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
environment=${APP_ENV:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
