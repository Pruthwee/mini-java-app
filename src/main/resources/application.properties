# Mini Java App Configuration
# ============================================================
# REMEDIATION (cr-java-0070 — Properties Files in Classpath):
#   Application configuration has been externalized from classpath-bundled
#   properties files to AWS Systems Manager Parameter Store.
#   At runtime, MiniApp.loadConfiguration() fetches all parameters under
#   the path prefix defined by SSM_PARAMETER_PATH (default: /mini-app)
#   using GetParametersByPath, enabling environment-specific configuration
#   changes without redeployment.
#
#   SSM_PARAMETER_PATH — set in ECS task definition / EKS pod spec / EB env config
#   Example SSM parameters: /mini-app/server/port, /mini-app/database/host
# ============================================================
# REMEDIATION (cr-java-0113 — Lack of Externalized Secrets):
#   All previously hard-coded credentials and API keys have been
#   removed from this file.  Sensitive values are now retrieved at
#   runtime from AWS Secrets Manager (secret name controlled by the
#   DB_SECRET_NAME environment variable) or injected as environment
#   variables by the deployment platform (ECS task definition, EKS
#   pod spec, or Elastic Beanstalk environment configuration).
#   Non-secret topology values are sourced from AWS Systems Manager
#   Parameter Store and injected as environment variables.
# ============================================================

# ---------------------------------------------------------------------------
# Server configuration
# ---------------------------------------------------------------------------
# SERVER_PORT — injected from SSM Parameter /mini-app/server/port
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# Database configuration
# ---------------------------------------------------------------------------
# Credentials (username, password) are retrieved exclusively from AWS Secrets
# Manager at runtime by DatabaseService.  The properties below cover only
# non-secret topology parameters.
#
# DB_PORT — injected from SSM Parameter /mini-app/database/port
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000
# ---------------------------------------------------------------------------
# HikariCP connection pool configuration (cr-java-0073 remediation)
# ---------------------------------------------------------------------------
# In production, DB_HOST should be set to the Amazon RDS Proxy endpoint so
# that HikariCP connections are multiplexed and managed at the proxy layer.
#
# DB_POOL_MAX_SIZE     — maximum connections in the pool (default: 10)
# DB_POOL_MIN_IDLE     — minimum idle connections (default: 2)
# DB_POOL_TIMEOUT_MS   — max wait for a connection from pool in ms (default: 30000)
# DB_POOL_IDLE_TIMEOUT — idle connection eviction timeout in ms (default: 600000)
# DB_POOL_MAX_LIFETIME — max connection lifetime in ms (default: 1800000)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=MiniAppHikariPool
spring.datasource.hikari.connection-test-query=SELECT 1

# AWS Secrets Manager secret name for database credentials
# DB_SECRET_NAME — set in ECS task definition / EKS pod spec / EB env config
database.secret.name=${DB_SECRET_NAME:mini-app/database/credentials}

# ---------------------------------------------------------------------------
# Cache configuration
# ---------------------------------------------------------------------------
# REDIS_HOST / REDIS_PORT — injected from SSM Parameters
# Redis credentials are stored in AWS Secrets Manager under the secret
# referenced by REDIS_SECRET_NAME.
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.secret.name=${REDIS_SECRET_NAME:mini-app/cache/credentials}
cache.redis.database=0

# ---------------------------------------------------------------------------
# External service URLs
# ---------------------------------------------------------------------------
# EXTERNAL_API_URL — injected from SSM Parameter /mini-app/external-api/url
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
# API key retrieved from AWS Secrets Manager; secret name injected via env var
external.api.secret.name=${EXTERNAL_API_SECRET_NAME:mini-app/external-api/credentials}

# PAYMENT_SERVICE_URL — injected from SSM Parameter /mini-app/payment/url
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# Payment credentials retrieved from AWS Secrets Manager
payment.service.secret.name=${PAYMENT_SECRET_NAME:mini-app/payment/credentials}

# ---------------------------------------------------------------------------
# Amazon S3 configuration
# ---------------------------------------------------------------------------
# S3_BUCKET_NAME / CONFIG_S3_KEY / LOG_S3_KEY / UPLOAD_S3_PREFIX
# injected from SSM Parameters or ECS/EKS environment configuration.
app.s3.bucket=${S3_BUCKET_NAME:mini-app-bucket}
app.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log-key=${LOG_S3_KEY:logs/mini-app.log}
app.s3.upload-prefix=${UPLOAD_S3_PREFIX:uploads/}

# ---------------------------------------------------------------------------
# Security configuration
# ---------------------------------------------------------------------------
# JWT secret, admin credentials, and encryption key are stored in AWS Secrets
# Manager.  The secret names below are resolved from environment variables so
# that different deployment environments can reference different secrets.
#
# SECURITY_SECRET_NAME — set in ECS task definition / EKS pod spec / EB env config
security.secret.name=${SECURITY_SECRET_NAME:mini-app/security/credentials}

# ---------------------------------------------------------------------------
# Monitoring / metrics configuration
# ---------------------------------------------------------------------------
# MONITORING_ENDPOINT — injected from SSM Parameter /mini-app/monitoring/endpoint
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
# Monitoring credentials retrieved from AWS Secrets Manager
monitoring.secret.name=${MONITORING_SECRET_NAME:mini-app/monitoring/credentials}

# ---------------------------------------------------------------------------
# Messaging configuration
# ---------------------------------------------------------------------------
# RABBITMQ_HOST / RABBITMQ_PORT — injected from SSM Parameters
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# RabbitMQ credentials retrieved from AWS Secrets Manager
messaging.rabbitmq.secret.name=${RABBITMQ_SECRET_NAME:mini-app/messaging/credentials}

# ---------------------------------------------------------------------------
# General application settings
# ---------------------------------------------------------------------------
# ENVIRONMENT — injected by deployment platform (e.g. "production", "staging")
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
