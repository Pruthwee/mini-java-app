# Mini Java App Configuration - Cloud-Ready (AWS)
# All sensitive values and environment-specific settings are externalised.
# Credentials are stored in AWS Secrets Manager; ports/paths in AWS SSM Parameter Store.
# Non-sensitive defaults are kept here; override at runtime via environment variables.

# -----------------------------------------------------------------------
# Server configuration
# blocker-14,15: port injected via SERVER_PORT environment variable
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.context-path=/mini-app

# -----------------------------------------------------------------------
# AWS configuration
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# Database configuration
# blocker-8,9,10,16: credentials resolved from AWS Secrets Manager at runtime
# blocker-11,12: port resolved from AWS SSM Parameter Store at runtime
# Secret name injected via DB_SECRET_NAME environment variable
# -----------------------------------------------------------------------
db.secret.name=${DB_SECRET_NAME:mini-app/db-credentials}
db.port.param=${DB_PORT_PARAM:/mini-app/db/port}

# -----------------------------------------------------------------------
# HikariCP connection pool settings (blocker-17,18,19)
# -----------------------------------------------------------------------
hikari.connection-timeout=30000
hikari.idle-timeout=600000
hikari.max-lifetime=1800000
hikari.maximum-pool-size=20
hikari.minimum-idle=5

# -----------------------------------------------------------------------
# Cache configuration
# blocker-13: Redis port resolved from AWS SSM Parameter Store at runtime
# -----------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port.param=${REDIS_PORT_PARAM:/mini-app/cache/redis-port}

# -----------------------------------------------------------------------
# External service URLs (12-factor: injected via environment variables)
# -----------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=30000
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}

# -----------------------------------------------------------------------
# Amazon S3 storage configuration
# blocker-1,2,3,4,5,6,7: file paths replaced with S3 bucket/key references
# -----------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-storage}
app.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log-key=${LOG_S3_KEY:logs/mini-app.log}

# -----------------------------------------------------------------------
# AWS SSM Parameter Store path for application configuration
# blocker-20: classpath properties replaced with SSM Parameter Store
# -----------------------------------------------------------------------
app.ssm.config-path=${SSM_CONFIG_PATH:/mini-app/config}

# -----------------------------------------------------------------------
# Security configuration
# blocker-16: all secrets stored in AWS Secrets Manager – NOT here
# JWT secret name injected via JWT_SECRET_NAME environment variable
# -----------------------------------------------------------------------
security.jwt.secret-name=${JWT_SECRET_NAME:mini-app/jwt-secret}

# -----------------------------------------------------------------------
# Monitoring/metrics endpoints (injected via environment variables)
# -----------------------------------------------------------------------
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}

# -----------------------------------------------------------------------
# Messaging configuration (injected via environment variables)
# -----------------------------------------------------------------------
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}

# -----------------------------------------------------------------------
# General application settings
# -----------------------------------------------------------------------
environment=${APP_ENV:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level.root=${LOG_LEVEL:INFO}
