# Mini Java App Configuration - Cloud-Ready with Environment Variables

# Cloud-ready: Server configuration from environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Cloud-ready: Database configuration from environment variables and Azure Key Vault
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:password123}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DB_POOL_MAX_SIZE:20}
database.pool.timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

# Cloud-ready: Cache configuration from environment variables
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# Cloud-ready: External service URLs from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT_MS:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# Cloud-ready: Azure Blob Storage configuration
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.account-url=${AZURE_STORAGE_ACCOUNT_URL:}
azure.storage.container-name=${BLOB_CONTAINER_NAME:app-config}
azure.storage.config-blob=${CONFIG_BLOB_NAME:app.properties}
azure.storage.log-blob=${LOG_BLOB_NAME:mini-app.log}

# Cloud-ready: Azure Key Vault configuration
azure.keyvault.url=${AZURE_KEY_VAULT_URL:}
azure.keyvault.db-username-secret=${DB_USERNAME_SECRET_NAME:db-username}
azure.keyvault.db-password-secret=${DB_PASSWORD_SECRET_NAME:db-password}

# Cloud-ready: Security configuration from Azure Key Vault
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Cloud-ready: Monitoring/metrics endpoints from environment
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Cloud-ready: Messaging configuration from environment
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Cloud-ready: Environment-specific values from environment variables
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Cloud-ready: HikariCP connection pool settings
hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD_MS:60000}

# Cloud-ready: Connection timeouts for resilience
http.connection.timeout=${HTTP_CONNECTION_TIMEOUT_MS:10000}
http.read.timeout=${HTTP_READ_TIMEOUT_MS:30000}
http.write.timeout=${HTTP_WRITE_TIMEOUT_MS:30000}

# Note: All sensitive credentials should be stored in Azure Key Vault
# and retrieved at runtime using Managed Identity authentication
