# Mini Java App Configuration — Cloud-Native (AWS)
# All sensitive values are externalized to AWS Secrets Manager or
# AWS Systems Manager Parameter Store.  Non-sensitive defaults are
# overridden at runtime via environment variables injected by ECS /
# EKS / Elastic Beanstalk.

# ---------------------------------------------------------------------------
# Server configuration (blocker-14, blocker-15)
# Port is resolved at runtime from SSM Parameter Store (/mini-app/server/port)
# or the SERVER_PORT environment variable.  The value below is the last-resort
# default only and should NOT be relied upon in cloud deployments.
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# Database configuration (blocker-8, blocker-9, blocker-10, blocker-11,
# blocker-12, blocker-16, blocker-17, blocker-18, blocker-19)
# Credentials are retrieved from AWS Secrets Manager at startup.
# Secret name is controlled by the DB_SECRET_NAME environment variable.
# Port is resolved from SSM Parameter Store (/mini-app/db/port) or DB_PORT.
# ---------------------------------------------------------------------------
database.secret-name=${DB_SECRET_NAME:mini-app/db-credentials}
database.host=${DB_HOST:}
database.port=${DB_PORT:}
database.name=${DB_NAME:mini_app_db}
# HikariCP pool settings
database.pool.max-connections=20
database.pool.min-idle=5
database.pool.connection-timeout=30000
database.pool.idle-timeout=600000
database.pool.max-lifetime=1800000

# ---------------------------------------------------------------------------
# Cache configuration (blocker-13)
# Redis host and port are injected via environment variables or resolved
# from SSM Parameter Store (/mini-app/cache/redis/port).
# ---------------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:}
cache.redis.port=${REDIS_PORT:}
# Redis password is stored in AWS Secrets Manager — do NOT hard-code here.
cache.redis.secret-name=${REDIS_SECRET_NAME:mini-app/redis-credentials}
cache.redis.database=0

# ---------------------------------------------------------------------------
# External service URLs (no hard-coded hostnames or ports)
# ---------------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:}
external.api.timeout=30000
# API key is stored in AWS Secrets Manager — do NOT hard-code here.
external.api.secret-name=${EXTERNAL_API_SECRET_NAME:mini-app/external-api-key}

payment.service.url=${PAYMENT_SERVICE_URL:}
# Payment credentials are stored in AWS Secrets Manager — do NOT hard-code here.
payment.service.secret-name=${PAYMENT_SECRET_NAME:mini-app/payment-credentials}

# ---------------------------------------------------------------------------
# Storage configuration (blocker-1, blocker-2, blocker-3, blocker-4,
# blocker-5, blocker-6, blocker-7)
# All file-system paths replaced with Amazon S3 bucket/key references.
# ---------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-storage}
app.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log-key-prefix=${LOG_S3_KEY_PREFIX:logs/mini-app/}

# ---------------------------------------------------------------------------
# SSM Parameter Store paths (blocker-20)
# Application configuration is loaded from Parameter Store at startup.
# ---------------------------------------------------------------------------
app.ssm.config-path=${SSM_CONFIG_PATH:/mini-app/config}
app.ssm.server-port-param=${SERVER_PORT_PARAM:/mini-app/server/port}
app.ssm.db-port-param=${DB_PORT_PARAM:/mini-app/db/port}
app.ssm.redis-port-param=${REDIS_PORT_PARAM:/mini-app/cache/redis/port}

# ---------------------------------------------------------------------------
# Security configuration
# All secrets (JWT key, admin credentials, encryption key) are stored in
# AWS Secrets Manager — do NOT hard-code here.
# ---------------------------------------------------------------------------
security.jwt.secret-name=${JWT_SECRET_NAME:mini-app/jwt-secret}
security.admin.secret-name=${ADMIN_SECRET_NAME:mini-app/admin-credentials}
security.encryption.secret-name=${ENCRYPTION_SECRET_NAME:mini-app/encryption-key}

# ---------------------------------------------------------------------------
# Monitoring / metrics
# ---------------------------------------------------------------------------
monitoring.endpoint=${MONITORING_ENDPOINT:}
monitoring.secret-name=${MONITORING_SECRET_NAME:mini-app/monitoring-credentials}

# ---------------------------------------------------------------------------
# Messaging configuration
# ---------------------------------------------------------------------------
messaging.rabbitmq.host=${RABBITMQ_HOST:}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.secret-name=${RABBITMQ_SECRET_NAME:mini-app/rabbitmq-credentials}

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
environment=${APP_ENV:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
