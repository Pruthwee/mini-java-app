# Mini Java App Configuration - Cloud-Ready with Environment Variables and AWS Integration

# FIXED: Server configuration using environment variables (cr-java-0077)
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# FIXED: Database configuration using environment variables and AWS Secrets Manager (cr-java-0069, cr-java-0077, cr-java-0113)
# Database credentials are retrieved from AWS Secrets Manager at runtime
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.secret.name=${DB_SECRET_NAME:mini-app/database/credentials}
database.driver=com.mysql.cj.jdbc.Driver

# FIXED: HikariCP connection pool configuration (cr-java-0073, cr-java-0097)
database.pool.max-connections=${DB_POOL_SIZE:10}
database.pool.min-idle=${DB_POOL_MIN_IDLE:2}
database.pool.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
database.pool.idle-timeout=${DB_IDLE_TIMEOUT:600000}
database.pool.max-lifetime=${DB_MAX_LIFETIME:1800000}
database.pool.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD:60000}
database.query.timeout=${DB_QUERY_TIMEOUT:30}

# FIXED: Cache configuration using environment variables (cr-java-0077)
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# FIXED: External service URLs using environment variables (cr-java-0077)
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# FIXED: File paths replaced with S3 configuration (cr-java-0061, cr-java-0063)
# All file operations now use Amazon S3 instead of local file system
app.s3.bucket.name=${S3_BUCKET_NAME:mini-app-config-bucket}
app.s3.config.key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log.key.prefix=${LOG_S3_KEY_PREFIX:logs/}
app.s3.temp.key.prefix=${TEMP_S3_KEY_PREFIX:temp/}
app.s3.upload.key.prefix=${UPLOAD_S3_KEY_PREFIX:uploads/}

# FIXED: AWS configuration (cr-java-0061, cr-java-0063, cr-java-0069, cr-java-0113)
aws.region=${AWS_REGION:us-east-1}
aws.secrets.manager.enabled=${AWS_SECRETS_MANAGER_ENABLED:true}
aws.parameter.store.enabled=${AWS_PARAMETER_STORE_ENABLED:true}

# FIXED: Security configuration using AWS Secrets Manager (cr-java-0113)
# All secrets are retrieved from AWS Secrets Manager at runtime
security.jwt.secret.name=${JWT_SECRET_NAME:mini-app/jwt/secret}
security.admin.secret.name=${ADMIN_SECRET_NAME:mini-app/admin/credentials}
security.encryption.secret.name=${ENCRYPTION_SECRET_NAME:mini-app/encryption/key}

# FIXED: Monitoring/metrics endpoints using environment variables (cr-java-0077)
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# FIXED: Messaging configuration using environment variables (cr-java-0077)
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# FIXED: Environment-specific configuration using environment variables (cr-java-0070)
# Configuration is now externalized and can be changed without redeployment
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Cloud-native configuration
cloud.platform=${CLOUD_PLATFORM:AWS}
cloud.deployment.type=${DEPLOYMENT_TYPE:ECS}

# Health check and readiness probe endpoints
management.health.enabled=${HEALTH_CHECK_ENABLED:true}
management.readiness.enabled=${READINESS_CHECK_ENABLED:true}
