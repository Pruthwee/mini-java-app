# Mini Java App Configuration — Cloud-Ready (AWS)
#
# FIX (cr-java-0070): This file previously contained classpath-bundled configuration
# properties that were immutable at runtime. All configuration has been migrated to
# AWS Systems Manager (SSM) Parameter Store to enable runtime configuration changes
# without redeployment and to support environment-specific configuration across
# dev/staging/prod environments.
#
# IMPORTANT: This file is retained only as a reference/documentation artifact.
# The application NO LONGER loads configuration from this classpath file at runtime.
# All configuration is loaded from AWS SSM Parameter Store via the MiniApp class
# using the GetParametersByPath API.
#
# FIX (cr-java-0113): All hardcoded secrets, passwords, API keys, and encryption
# keys have been removed from this file.  Sensitive values are now stored in
# AWS Secrets Manager and retrieved at runtime via environment variables that
# reference the secret name/ARN.  Non-sensitive configuration values are
# externalised to environment variables following 12-factor app principles.
#
# ============================================================================
# AWS SSM Parameter Store Migration Guide
# ============================================================================
#
# SSM Parameter Store path prefix: /mini-java-app  (configurable via SSM_PARAMETER_PATH env var)
#
# Create the following parameters in AWS SSM Parameter Store:
#
#   Parameter Name                          Type        Value
#   ─────────────────────────────────────── ─────────── ──────────────────────────────────────
#   /mini-java-app/server/port              String      8080
#   /mini-java-app/server/host              String      localhost
#   /mini-java-app/server/context-path      String      /mini-app
#   /mini-java-app/app/environment          String      production
#   /mini-java-app/app/debug-enabled        String      false
#   /mini-java-app/app/logging-level        String      INFO
#   /mini-java-app/aws/region               String      us-east-1
#   /mini-java-app/s3/bucket-name           String      mini-app-bucket
#   /mini-java-app/s3/config-key            String      config/app.properties
#   /mini-java-app/s3/log-key               String      logs/mini-app.log
#   /mini-java-app/database/pool/max-conn   String      20
#   /mini-java-app/database/pool/timeout    String      5000
#   /mini-java-app/cache/redis/host         String      127.0.0.1
#   /mini-java-app/cache/redis/port         String      6379
#   /mini-java-app/cache/redis/database     String      0
#   /mini-java-app/external/api/base-url    String      http://api.example.com:8080/v1
#   /mini-java-app/external/api/timeout     String      30000
#   /mini-java-app/payment/service/url      String      https://payment.internal.company.com/process
#   /mini-java-app/monitoring/endpoint      String      http://monitoring.internal.company.com:9090/metrics
#   /mini-java-app/messaging/rabbitmq/host  String      rabbitmq.internal.company.com
#   /mini-java-app/messaging/rabbitmq/port  String      5672
#
# Sensitive parameters (use SecureString type in SSM):
#   /mini-java-app/db/secret-name           SecureString  mini-java-app/db-credentials
#   /mini-java-app/redis/secret-name        SecureString  mini-java-app/redis-credentials
#   /mini-java-app/external/api/secret-name SecureString  mini-java-app/external-api-credentials
#   /mini-java-app/payment/secret-name      SecureString  mini-java-app/payment-credentials
#   /mini-java-app/security/secret-name     SecureString  mini-java-app/security-credentials
#   /mini-java-app/monitoring/secret-name   SecureString  mini-java-app/monitoring-credentials
#   /mini-java-app/messaging/secret-name    SecureString  mini-java-app/messaging-credentials
#
# ============================================================================
# Required Environment Variables
# ============================================================================
#
# The following environment variables must be set in the deployment environment
# (ECS task definition, EKS pod spec, EC2 instance, Lambda function, etc.):
#
#   SSM_PARAMETER_PATH   — SSM path prefix (default: /mini-java-app)
#   AWS_REGION           — AWS region (default: us-east-1)
#   SERVER_PORT          — Server port (default: 8080)
#   S3_BUCKET_NAME       — S3 bucket for app storage (default: mini-app-bucket)
#   S3_CONFIG_KEY        — S3 key for config object (default: config/app.properties)
#   S3_LOG_KEY           — S3 key for log object (default: logs/mini-app.log)
#   DB_SECRET_NAME       — Secrets Manager secret for DB credentials
#   DB_PORT              — Database port (default: 3306)
#   REDIS_HOST           — Redis host (default: 127.0.0.1)
#   REDIS_PORT           — Redis port (default: 6379)
#
# ============================================================================
# Required IAM Permissions
# ============================================================================
#
# The running workload (ECS task role, EC2 instance profile, Lambda execution role)
# must have the following IAM permissions:
#
#   ssm:GetParametersByPath  on arn:aws:ssm:<region>:<account>:parameter/mini-java-app/*
#   ssm:GetParameter         on arn:aws:ssm:<region>:<account>:parameter/mini-java-app/*
#   secretsmanager:GetSecretValue on each secret ARN listed below.
#   s3:GetObject             on arn:aws:s3:::mini-app-bucket/*
#   s3:PutObject             on arn:aws:s3:::mini-app-bucket/*
#
# ============================================================================
# Local Development Fallback
# ============================================================================
#
# For local development without SSM access, set the following environment variables
# directly in your IDE run configuration or .env file:
#
#   SERVER_PORT=8080
#   AWS_REGION=us-east-1
#   S3_BUCKET_NAME=mini-app-bucket
#   DB_SECRET_NAME=mini-java-app/db-credentials
#   SSM_PARAMETER_PATH=/mini-java-app
