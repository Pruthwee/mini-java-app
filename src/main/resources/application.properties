# Mini Java App Configuration
#
# FIXED (cr-java-0113): All hardcoded secrets, passwords, API keys, and encryption keys
# have been removed from this file. Sensitive values must be stored in AWS Secrets Manager
# and injected at runtime via environment variables through ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment properties.
#
# FIXED (cr-java-0077): All hardcoded port numbers have been replaced with environment
# variable references. Store port values in AWS Systems Manager Parameter Store and
# inject at runtime through ECS task definition environment, EKS pod spec, or
# Elastic Beanstalk environment properties.

# Server configuration — SERVER_PORT injected via environment variable
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# AWS SDK and JDBC connection timeout configuration (cr-java-0097)
# Prevents indefinite hangs in cloud environments with variable network latency.
# Set these in ECS task definition, EKS pod spec, or Elastic Beanstalk env config.
aws.sdk.connect.timeout.ms=${AWS_SDK_CONNECT_TIMEOUT_MS:5000}
aws.sdk.socket.timeout.ms=${AWS_SDK_SOCKET_TIMEOUT_MS:10000}
aws.sdk.api.call.timeout.ms=${AWS_SDK_API_CALL_TIMEOUT_MS:15000}
aws.sdk.api.attempt.timeout.ms=${AWS_SDK_API_ATTEMPT_TIMEOUT_MS:10000}

# JDBC-level connection and socket timeouts (cr-java-0097)
# Applied as MySQL JDBC URL parameters (connectTimeout, socketTimeout) in seconds.
database.connect.timeout.s=${DB_CONNECT_TIMEOUT_S:10}
database.socket.timeout.s=${DB_SOCKET_TIMEOUT_S:30}

# Database configuration
# Credentials and connection details are retrieved from AWS Secrets Manager at runtime
# via the DB_SECRET_NAME environment variable (see DatabaseService.java).
# DB_HOST, DB_PORT, DB_NAME are used only as fallback for non-secret connection params.
database.secret.name=${DB_SECRET_NAME:mini-app/db-credentials}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration
# REDIS_HOST and REDIS_PORT injected via environment variable (cr-java-0077)
# REDIS_PASSWORD must be stored in AWS Secrets Manager — do NOT set a default here.
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs — full URLs (including ports) injected via environment variables
# API keys must be stored in AWS Secrets Manager — do NOT set a default here.
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME}
payment.service.password=${PAYMENT_SERVICE_PASSWORD}

# File paths — replaced with S3 keys via environment variables (cr-java-0063)
app.config.directory=${APP_CONFIG_DIRECTORY:/opt/app/config}
app.log.directory=${APP_LOG_DIRECTORY:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIRECTORY:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIRECTORY:/opt/uploads}

# Security configuration
# JWT_SECRET, ADMIN_PASSWORD, and ENCRYPTION_KEY must be stored in AWS Secrets Manager.
# Do NOT provide default values for secrets here — they must be injected at runtime.
security.jwt.secret=${JWT_SECRET}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD}
security.encryption.key=${ENCRYPTION_KEY}

# Monitoring/metrics — MONITORING_PORT injected via environment variable (cr-java-0077)
# MONITORING_PASSWORD must be stored in AWS Secrets Manager — do NOT set a default here.
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com/metrics}
monitoring.username=${MONITORING_USERNAME:monitor_user}
monitoring.password=${MONITORING_PASSWORD}

# Messaging configuration — RABBITMQ_PORT injected via environment variable (cr-java-0077)
# RABBITMQ_PASSWORD must be stored in AWS Secrets Manager — do NOT set a default here.
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:rabbitmq_user}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD}

# Environment-specific values
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}
