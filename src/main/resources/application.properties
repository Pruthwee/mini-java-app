# Mini Java App Configuration - Cloud-ready with externalized configuration
# All sensitive values and environment-specific settings are externalized
# to Azure App Configuration and Azure Key Vault

# Server configuration - externalized to environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# Database configuration - credentials externalized to Azure Key Vault
database.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}}
database.username=${DB_USERNAME}
database.password=${DB_PASSWORD}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_MAX_POOL_SIZE:20}
database.pool.timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
database.query.timeout=${DB_QUERY_TIMEOUT_SECONDS:30}

# Cache configuration - externalized to environment variables
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs - externalized to environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY}

# Payment service configuration - credentials externalized to Azure Key Vault
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME}
payment.service.password=${PAYMENT_SERVICE_PASSWORD}

# File paths - externalized to Azure Blob Storage
app.config.directory=${APP_CONFIG_DIRECTORY}
app.log.directory=${APP_LOG_DIRECTORY}
app.temp.directory=${APP_TEMP_DIRECTORY}
app.upload.directory=${APP_UPLOAD_DIRECTORY}

# Azure Blob Storage configuration
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.account=${AZURE_STORAGE_ACCOUNT:miniastorage}
azure.storage.container=${BLOB_CONTAINER_NAME:mini-app-config}

# Azure Key Vault configuration
azure.keyvault.url=${AZURE_KEY_VAULT_URL}

# Security configuration - secrets externalized to Azure Key Vault
security.jwt.secret=${JWT_SECRET}
security.admin.username=${ADMIN_USERNAME}
security.admin.password=${ADMIN_PASSWORD}
security.encryption.key=${ENCRYPTION_KEY}

# Monitoring/metrics endpoints - externalized to environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME}
monitoring.password=${MONITORING_PASSWORD}

# Messaging configuration - externalized to environment variables
messaging.rabbitmq.host=${MESSAGING_RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${MESSAGING_RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${MESSAGING_RABBITMQ_USERNAME}
messaging.rabbitmq.password=${MESSAGING_RABBITMQ_PASSWORD}

# Environment-specific values
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}
