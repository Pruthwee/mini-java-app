# Mini Java App Configuration - Cloud-Native with AWS Systems Manager Parameter Store
#
# IMPORTANT: This application now uses AWS Systems Manager Parameter Store for externalized configuration
# instead of classpath-bundled properties files. This enables runtime configuration changes without redeployment.
#
# Configuration Migration:
# - All configuration properties should be stored in AWS Systems Manager Parameter Store
# - Parameter Store path: /mini-app/config/ (configurable via PARAMETER_STORE_PATH environment variable)
# - Parameters can be updated in Parameter Store without requiring application redeployment
# - Supports both String and SecureString parameter types for sensitive data
#
# Example Parameter Store structure:
#   /mini-app/config/server/port = 8080
#   /mini-app/config/database/url = jdbc:mysql://...
#   /mini-app/config/database/pool/max-connections = 20
#
# This file is kept for documentation and local development fallback purposes only.

# Cloud-ready: Server configuration using environment variables
# Set SERVER_PORT environment variable to override default port
# Example: export SERVER_PORT=8080
server.port=${SERVER_PORT:8080}
server.host=localhost
server.context-path=/mini-app

# Cloud-native: Database configuration using environment variables and AWS Secrets Manager
# Database credentials are retrieved from AWS Secrets Manager
# 
# REQUIRED Environment Variables:
#   DB_SECRET_ARN - ARN of the secret in AWS Secrets Manager (e.g., arn:aws:secretsmanager:us-east-1:123456789012:secret:mini-app/db-credentials)
#   AWS_REGION - AWS region where secrets are stored (default: us-east-1)
# 
# Secret JSON Format in AWS Secrets Manager:
#   {"username": "db_user", "password": "db_password"}
# 
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.secret.arn=${DB_SECRET_ARN:arn:aws:secretsmanager:us-east-1:123456789012:secret:mini-app/db-credentials}
# Fallback credentials (only used if AWS Secrets Manager is unavailable - NOT RECOMMENDED for production)
database.username=${DB_USERNAME:root}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# HikariCP Connection Pool Configuration (Cloud-optimized)
# These settings are optimized for cloud environments with AWS RDS Proxy
hikaricp.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
hikaricp.minimum-idle=${DB_POOL_MIN_IDLE:5}
hikaricp.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
hikaricp.idle-timeout=${DB_IDLE_TIMEOUT:600000}
hikaricp.max-lifetime=${DB_MAX_LIFETIME:1800000}
hikaricp.connection-test-query=SELECT 1
hikaricp.pool-name=MiniAppHikariPool
hikaricp.leak-detection-threshold=60000

# Cloud-ready: Cache configuration using environment variables
# Set REDIS_PORT environment variable to override default port
# Example: export REDIS_PORT=6379
cache.redis.host=127.0.0.1
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=redis_secret_123
cache.redis.database=0

# BLOCKER: Hardcoded external service URLs
external.api.base-url=http://api.example.com:8080/v1
external.api.timeout=30000
external.api.key=hardcoded_api_key_12345

payment.service.url=https://payment.internal.company.com/process
payment.service.username=payment_user
payment.service.password=payment_secret_456

# Cloud-ready: S3 configuration for file storage (replaces hardcoded file paths)
aws.s3.bucket.name=${S3_BUCKET_NAME:mini-app-config-bucket}
aws.s3.config.key=${CONFIG_OBJECT_KEY:config/app.properties}
aws.s3.log.key=${LOG_OBJECT_KEY:logs/mini-app.log}
aws.region=${AWS_REGION:us-east-1}

# Temporary directory can use container ephemeral storage
app.temp.directory=${TEMP_DIR:/tmp/mini-app}
app.upload.directory=/opt/uploads

# BLOCKER: Hardcoded security configuration
security.jwt.secret=my_super_secret_jwt_key_123456789
security.admin.username=admin
security.admin.password=admin123
security.encryption.key=encryption_key_hardcoded

# BLOCKER: Hardcoded monitoring/metrics endpoints
monitoring.endpoint=http://monitoring.internal.company.com:9090/metrics
monitoring.username=monitor_user
monitoring.password=monitor_pass

# BLOCKER: Hardcoded messaging configuration
messaging.rabbitmq.host=rabbitmq.internal.company.com
messaging.rabbitmq.port=5672
messaging.rabbitmq.username=rabbitmq_user
messaging.rabbitmq.password=rabbitmq_secret

# BLOCKER: Environment-specific hardcoded values
environment=production
debug.enabled=false
logging.level=INFO