# Mini Java App Configuration - Externalized for AWS

# Server configuration - port from environment with default
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# Database configuration - host, port, name from environment
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.username=${DB_USER:root}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# Database credentials from AWS Secrets Manager (secret name from environment)
database.secret.name=${DB_SECRET_NAME}

# Cache configuration - host and port from environment
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.database=0

# External service URLs from environment
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}

# File paths - now mapped to S3
app.config.directory=${APP_CONFIG_DIR:/tmp/mini-app/config}
app.log.directory=${APP_LOG_DIR:/tmp/mini-app/logs}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app/temp}
app.upload.directory=${APP_UPLOAD_DIR:/tmp/mini-app/uploads}

# S3 configuration
app.s3.bucket=${APP_S3_BUCKET:mini-app-bucket}
app.s3.config-key=${APP_CONFIG_S3_KEY:config/app.properties}
app.s3.log-key=${APP_LOG_S3_KEY:logs/mini-app.log}

# Parameter Store configuration
app.parameter.path=${APP_PARAMETER_PATH:/mini-app/config/}

# Security configuration - secrets from AWS Secrets Manager
security.jwt.secret=${SECURITY_JWT_SECRET}
security.admin.username=${SECURITY_ADMIN_USERNAME:admin}
security.encryption.key=${SECURITY_ENCRYPTION_KEY}

# Monitoring/metrics endpoints from environment
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}

# Messaging configuration from environment
messaging.rabbitmq.host=${MESSAGING_RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${MESSAGING_RABBITMQ_PORT:5672}

# Environment-specific values
environment=${ENVIRONMENT:production}
debug.enabled=false

# Safe logging: prevent SDK wire logs from exposing secrets
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level=INFO
