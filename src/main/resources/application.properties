# Mini Java App Configuration - Externalized for cloud deployment

# Externalized server configuration (cr-java-0077)
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# Externalized database configuration (cr-java-0069, cr-java-0077)
# Credentials retrieved from AWS Secrets Manager via DB_SECRET_NAME
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# Externalized cache configuration (cr-java-0077)
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.database=0

# Externalized external service URLs
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}

# Externalized file paths - now S3 buckets/keys (cr-java-0061, cr-java-0063)
app.config.bucket=${CONFIG_S3_BUCKET}
app.config.key=${CONFIG_S3_KEY:config/app.properties}
app.log.bucket=${LOG_S3_BUCKET}
app.log.key=${LOG_S3_KEY:mini-app.log}
app.temp.directory=${java.io.tmpdir}
app.upload.bucket=${UPLOAD_S3_BUCKET}

# Security configuration - secrets from AWS Secrets Manager (cr-java-0113)
security.jwt.secret=${JWT_SECRET}
security.admin.username=${ADMIN_USERNAME}
security.admin.password=${ADMIN_PASSWORD}
security.encryption.key=${ENCRYPTION_KEY}

# Externalized monitoring/metrics endpoints
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}

# Externalized messaging configuration (cr-java-0077)
messaging.rabbitmq.host=${MESSAGING_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${MESSAGING_PORT:5672}

# Environment configuration
environment=${ENVIRONMENT:production}
debug.enabled=false

# Safe logging configuration (cloud-services skill)
# Prevents AWS SDK from logging secrets, wire data, and request/response details
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
