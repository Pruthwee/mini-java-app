# Mini Java App – Bootstrap / Reference Configuration
# =============================================================================
# cr-java-0070 FIX: Runtime application configuration has been externalised from
# this classpath-bundled properties file to AWS Systems Manager (SSM) Parameter
# Store, following cloud-native 12-factor app principles.
#
# This file now contains ONLY bootstrap properties that are needed before the
# SSM client can be initialised (e.g., AWS region, SSM path prefix) and
# non-sensitive local-development defaults.  All environment-specific and
# sensitive configuration is stored in SSM Parameter Store and loaded at
# application startup via MiniApp#loadConfigurationFromSsm().
#
# SSM Parameter Store layout (default path prefix: /mini-java-app/config):
#   /mini-java-app/config/server.port              -> server port
#   /mini-java-app/config/server.host              -> server host
#   /mini-java-app/config/server.context-path      -> context path
#   /mini-java-app/config/hikari.maximum-pool-size -> DB pool max size
#   /mini-java-app/config/hikari.minimum-idle      -> DB pool min idle
#   /mini-java-app/config/hikari.connection-timeout-> DB pool connection timeout
#   /mini-java-app/config/cache.redis.host         -> Redis host
#   /mini-java-app/config/cache.redis.port         -> Redis port
#   /mini-java-app/config/external.api.base-url    -> External API base URL
#   /mini-java-app/config/logging.level            -> Log level
#   /mini-java-app/config/environment              -> App environment name
#   ... (all other runtime parameters)
#
# To update configuration without redeployment, modify the corresponding
# SSM Parameter Store parameter using the AWS Console, AWS CLI, or SDK:
#   aws ssm put-parameter \
#     --name "/mini-java-app/config/server.port" \
#     --value "9090" \
#     --type "String" \
#     --overwrite
# =============================================================================

# ---------------------------------------------------------------------------
# Bootstrap: AWS connection settings (required before SSM client initialises)
# These values are read directly from environment variables at JVM startup.
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Bootstrap: SSM Parameter Store path prefix
# All runtime configuration is loaded from this SSM path at startup.
# cr-java-0070 FIX: replaces classpath-bundled application.properties for
# runtime configuration.
# ---------------------------------------------------------------------------
ssm.config.path=${SSM_CONFIG_PATH:/mini-java-app/config}

# ---------------------------------------------------------------------------
# Bootstrap: S3 references for config and log objects
# ---------------------------------------------------------------------------
s3.bucket=${S3_BUCKET:my-app-bucket}
s3.config.key=${CONFIG_S3_KEY:config/app.properties}
s3.log.key=${LOG_S3_KEY:logs/mini-app.log}

# ---------------------------------------------------------------------------
# Local development fallback defaults (used only when SSM is unavailable)
# These values are NEVER used in cloud deployments; SSM Parameter Store
# values always take precedence.
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app
logging.level=${LOG_LEVEL:INFO}
environment=${APP_ENVIRONMENT:local}
debug.enabled=${DEBUG_ENABLED:false}
