apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbasic
  namespace: mbasic
  labels:
    app: mbasic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mbasic
  template:
    metadata:
      labels:
        app: mbasic
    spec:
      containers:
        - name: mbasic
          image: {{IMAGE_URI}}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: DATABASE_URL
              value: "{{DATABASE_URL}}"
            - name: DATABASE_USERNAME
              value: "{{DATABASE_USERNAME}}"
            - name: DATABASE_PASSWORD
              value: "{{DATABASE_PASSWORD}}"
            - name: CACHE_REDIS_HOST
              value: "{{CACHE_REDIS_HOST}}"
            - name: CACHE_REDIS_PORT
              value: "{{CACHE_REDIS_PORT}}"
            - name: CACHE_REDIS_PASSWORD
              value: "{{CACHE_REDIS_PASSWORD}}"
            - name: EXTERNAL_API_BASE_URL
              value: "{{EXTERNAL_API_BASE_URL}}"
            - name: EXTERNAL_API_KEY
              value: "{{EXTERNAL_API_KEY}}"
            - name: PAYMENT_SERVICE_URL
              value: "{{PAYMENT_SERVICE_URL}}"
            - name: PAYMENT_SERVICE_USERNAME
              value: "{{PAYMENT_SERVICE_USERNAME}}"
            - name: PAYMENT_SERVICE_PASSWORD
              value: "{{PAYMENT_SERVICE_PASSWORD}}"
            - name: SECURITY_JWT_SECRET
              value: "{{SECURITY_JWT_SECRET}}"
            - name: SECURITY_ADMIN_USERNAME
              value: "{{SECURITY_ADMIN_USERNAME}}"
            - name: SECURITY_ADMIN_PASSWORD
              value: "{{SECURITY_ADMIN_PASSWORD}}"
            - name: MESSAGING_RABBITMQ_HOST
              value: "{{MESSAGING_RABBITMQ_HOST}}"
            - name: MESSAGING_RABBITMQ_USERNAME
              value: "{{MESSAGING_RABBITMQ_USERNAME}}"
            - name: MESSAGING_RABBITMQ_PASSWORD
              value: "{{MESSAGING_RABBITMQ_PASSWORD}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
