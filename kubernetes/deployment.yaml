apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-java-app
  namespace: mini-java-app
  labels:
    app: mini-java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-java-app
  template:
    metadata:
      labels:
        app: mini-java-app
    spec:
      containers:
        - name: mini-java-app
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: DATABASE_URL
              value: "{{DATABASE_URL}}"
            - name: DATABASE_USERNAME
              value: "{{DATABASE_USERNAME}}"
            - name: DATABASE_PASSWORD
              value: "{{DATABASE_PASSWORD}}"
            - name: CACHE_REDIS_HOST
              value: "{{CACHE_REDIS_HOST}}"
            - name: EXTERNAL_API_BASE_URL
              value: "{{EXTERNAL_API_BASE_URL}}"
            - name: MESSAGING_RABBITMQ_HOST
              value: "{{MESSAGING_RABBITMQ_HOST}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
