apiVersion: apps/v1
kind: Deployment
metadata:
  name: minijava-bach-con-1439
  namespace: minijava-bach-con-1439
  labels:
    app: minijava-bach-con-1439
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minijava-bach-con-1439
  template:
    metadata:
      labels:
        app: minijava-bach-con-1439
    spec:
      containers:
        - name: minijava-bach-con-1439
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
              name: app
            - containerPort: 8081
              name: health
          env:
            - name: APP_PORT
              value: "8080"
            - name: HEALTH_PORT
              value: "8081"
            - name: CONFIG_PATH
              value: "{{CONFIG_PATH}}"
            - name: LOG_PATH
              value: "{{LOG_PATH}}"
            - name: LOG_DIR
              value: "{{LOG_DIR}}"
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: db-password
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: redis-password
            - name: EXTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: external-api-key
            - name: PAYMENT_SERVICE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: payment-service-username
            - name: PAYMENT_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: payment-service-password
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: security-jwt-secret
            - name: SECURITY_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: security-admin-username
            - name: SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: security-admin-password
            - name: SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: security-encryption-key
            - name: MONITORING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: monitoring-username
            - name: MONITORING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: monitoring-password
            - name: MESSAGING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: messaging-rabbitmq-username
            - name: MESSAGING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minijava-bach-con-1439-secrets
                  key: messaging-rabbitmq-password
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
