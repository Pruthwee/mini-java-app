apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-java-app
  namespace: mini-java-app
  labels:
    app: mini-java-app
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-java-app
  template:
    metadata:
      labels:
        app: mini-java-app
        version: "1.0.0"
    spec:
      containers:
        - name: mini-java-app
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            # Server configuration
            - name: SERVER_PORT
              value: "8080"
            - name: HEALTH_CHECK_PORT
              value: "8081"

            # Application paths
            - name: APP_CONFIG_FILE_PATH
              value: /opt/app/config/app.properties
            - name: APP_LOG_FILE_PATH
              value: /mnt/efs/logs/mini-app/app.log
            - name: APP_LOG_DIRECTORY
              value: /mnt/efs/logs/mini-app

            # Database configuration
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USERNAME
              value: "{{DB_USERNAME}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"

            # Redis cache configuration
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"

            # External service configuration
            - name: EXTERNAL_API_URL
              value: "{{EXTERNAL_API_URL}}"
            - name: PAYMENT_SERVICE_URL
              value: "{{PAYMENT_SERVICE_URL}}"

            # JVM options
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=UTC"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: app-config
              mountPath: /opt/app/config
            - name: app-logs
              mountPath: /mnt/efs/logs/mini-app

      volumes:
        - name: app-config
          emptyDir: {}
        - name: app-logs
          emptyDir: {}

      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
