apiVersion: v1
kind: Service
metadata:
  name: {{ include "mini-java-app.fullname" . }}
  labels:
    {{- include "mini-java-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # ── Port references driven by values.yaml (cz-java-0061 remediation) ──────
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mini-java-app.selectorLabels" . | nindent 4 }}
