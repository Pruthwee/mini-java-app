# Kubernetes NetworkPolicy for EKS - cz-java-0082 Remediation
#
# Rule: cz-java-0082 - Individual Components (Service Isolation)
# Remediation: Enforce Service Isolation with Kubernetes NetworkPolicy on EKS
#
# These NetworkPolicy resources enforce explicit, least-privilege communication
# between decomposed microservices on EKS, preventing residual tight coupling
# through unrestricted network access.
#
# Apply with: kubectl apply -f k8s-network-policy.yaml -n <your-namespace>

---
# NetworkPolicy: mini-java-app
# Restricts ingress/egress for the mini-java-app pod to only the explicitly
# permitted peers (database, redis, external-api, payment-service).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mini-java-app-network-policy
  namespace: default
  labels:
    app: mini-java-app
    policy: service-isolation
    rule: cz-java-0082
spec:
  podSelector:
    matchLabels:
      app: mini-java-app
  policyTypes:
    - Ingress
    - Egress

  # ── Ingress rules ──────────────────────────────────────────────────────────
  ingress:
    # Allow inbound HTTP traffic from the ingress controller / API gateway only
    - from:
        - podSelector:
            matchLabels:
              role: ingress-controller
      ports:
        - protocol: TCP
          port: 8080

    # Allow health-check probes from the kubelet (node-level)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0   # Kubelet probes originate from the node IP
      ports:
        - protocol: TCP
          port: 8080

  # ── Egress rules ───────────────────────────────────────────────────────────
  egress:
    # Allow outbound to the MySQL database service only
    - to:
        - podSelector:
            matchLabels:
              app: mysql-db
      ports:
        - protocol: TCP
          port: 3306

    # Allow outbound to the Redis cache service only
    - to:
        - podSelector:
            matchLabels:
              app: redis-cache
      ports:
        - protocol: TCP
          port: 6379

    # Allow outbound to the external API service (egress via egress gateway)
    - to:
        - podSelector:
            matchLabels:
              app: external-api-proxy
      ports:
        - protocol: TCP
          port: 8080

    # Allow outbound to the payment service
    - to:
        - podSelector:
            matchLabels:
              app: payment-service
      ports:
        - protocol: TCP
          port: 443

    # Allow DNS resolution (required for service discovery)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# NetworkPolicy: mysql-db
# Restricts the database pod to accept connections only from mini-java-app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-db-network-policy
  namespace: default
  labels:
    app: mysql-db
    policy: service-isolation
    rule: cz-java-0082
spec:
  podSelector:
    matchLabels:
      app: mysql-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mini-java-app
      ports:
        - protocol: TCP
          port: 3306
  egress:
    # Allow DNS only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# NetworkPolicy: redis-cache
# Restricts the Redis pod to accept connections only from mini-java-app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cache-network-policy
  namespace: default
  labels:
    app: redis-cache
    policy: service-isolation
    rule: cz-java-0082
spec:
  podSelector:
    matchLabels:
      app: redis-cache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mini-java-app
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Allow DNS only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
