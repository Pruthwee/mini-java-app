# Mini Java App Configuration - Containerization-Ready

# Server configuration (sourced from Kubernetes ConfigMap env vars)
server.port=${APP_SERVER_PORT:8080}
server.servlet.context-path=${APP_CONTEXT_PATH:/mini-app}

# Spring Boot Actuator - expose health endpoint for container probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.server.port=${MANAGEMENT_PORT:8081}

# Logging level (sourced from Kubernetes ConfigMap env var)
logging.level.root=${APP_LOG_LEVEL:INFO}

# Database configuration (sourced from Kubernetes ConfigMap / Secret env vars)
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration (sourced from Kubernetes ConfigMap / Secret env vars)
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs (sourced from Kubernetes ConfigMap env vars)
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# File paths (sourced from Kubernetes ConfigMap env vars; mount ConfigMap/PVC at these paths)
app.config.directory=${APP_CONFIG_DIR:/mnt/config}
app.log.directory=${APP_LOG_DIR:/mnt/efs/logs}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIR:/mnt/uploads}

# Security configuration (sourced from Kubernetes Secrets env vars)
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints (sourced from Kubernetes ConfigMap env vars)
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration (sourced from Kubernetes ConfigMap / Secret env vars)
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment-specific values (sourced from Kubernetes ConfigMap env vars)
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
